# Exe AI — configuration
#
# This version-controlled file is the configuration template. Do NOT store
# secrets such as API keys or passwords here. Put them in .env; see
# .env.example.
#
# It is also the list of everything the program knows. On every start the file
# you actually use is compared against this one, and any key missing from
# yours is written in with its comment — so a setting that arrives with an
# update is visible instead of hidden. Your own values are never touched, and
# a key added that way gets the program's built-in default, not the value
# below: what stands here is how a FRESH installation starts out.
#
# All paths are relative to the project directory unless given as absolute.
#
# Comments here are English because everyone who sets this up reads them.
# The source code stays German; that is the project's own language.
#
# Place each key's explanation ABOVE it or on the same line. A standalone
# comment AFTER a value is associated with the next key and will be copied
# with that key.

app:
  # Address the service listens on.
  # Local only: the service binds to 127.0.0.1; put your own reverse proxy
  # in front if you need remote access.
  host: "127.0.0.1"
  port: 8090
  # A service bound beyond 127.0.0.1 — your LAN, a VPN — runs only with a
  # password, and asks every client for it once. The password stands in the
  # file named here (relative to the data folder, or absolute), never in
  # this file itself. Empty: no password, and the service refuses to start
  # on any host but the loopback address.
  password_file: ""
  # Default language of the interface: "en" or "de". English is the primary
  # language, German is kept fully equivalent. A request that names a
  # language overrides this: the interface's own X-Ui-Language header first,
  # then Accept-Language (app/api/abhaengigkeiten.py).
  language: "en"
  # The interface's diagnostic harness (the geometry watch): records
  # scroll anomalies, shows a report window and writes marker lines into
  # the access log. Meant for test services only.
  diagnose: false
  # Name displayed in system notifications for scheduled tasks. If empty,
  # the program's own name is used. Give test services a distinct name so
  # their notifications can be distinguished from those of the installed
  # app.
  meldetitel: ""
  # Timezone for agent schedules (6.7). Times like schedule: "08:00" in an
  # agent file are read in this zone. Without it, the server zone applies —
  # and this server runs on UTC, which is not what a schedule usually means.
  timezone: "Europe/Berlin"
  # Directory for the database, uploaded documents and generated images.
  data_dir: "./data"
  log_dir: "./logs"
  # Directory for generated images; a named storage location managed by
  # app/speicherorte.py. If empty, it resides under data_dir and moves with
  # the data folder. Set an absolute path to store images on another drive.
  bilder_verzeichnis: ""
  # Where the scripts a cron entry may start are kept. A named storage
  # location like the pictures above, and empty means the same thing: under
  # data_dir. It is also the boundary — a schedule can only start a file that
  # lies inside this folder, links leading out of it included.
  skripte_verzeichnis: ""
  # Directory for files delivered by agents to the dock. Like the two
  # locations above, an empty value places it under data_dir. The shelf's
  # index is stored in this folder, so moving the folder moves the entire
  # shelf.
  agentendock_verzeichnis: ""
  # Where the system prompt lives. Exactly one file for the whole program — not
  # one per model and no copy in the database. It is read fresh on EVERY
  # request, so an edit takes effect immediately, including in chats that
  # already exist. Edit it in the program under Chat -> System prompt, or by
  # hand. It ships empty.
  system_prompt_file: "./prompts/system.md"
  # Persistent memory: a separate prompt file that can be edited by the
  # model or manually and is read afresh with every request. Initially
  # empty.
  memory_file: "./prompts/memory.md"
  # Each agent is a Markdown file containing front matter and instructions.
  # Built-in agents are stored beside the program and replaced during
  # updates. User-defined agents are stored beside the prompts and remain
  # untouched. If both locations contain the same name, the user's version
  # takes precedence.
  agenten_verzeichnis: "./prompts/agenten"
  agenten_mitgeliefert: "./agenten"
  # Permission rules used to evaluate tool calls (Tor 3). Like
  # mcp_servers.json, this is a personal configuration file. The program
  # ships berechtigungen.example.json and creates your own copy on first
  # launch.
  berechtigungen_datei: "./berechtigungen.json"
  # Skills are stored in two locations. Built-in skills reside beside the
  # program and are replaced during updates. User-defined skills reside beside
  # the prompts and remain untouched. If both locations contain the same name,
  # the user's version takes precedence.
  skills_mitgeliefert: "./skills"
  skills_verzeichnis: "./prompts/skills"
  # Directory containing model files. Only files within this directory can
  # be started.
  modelle_verzeichnis: "./data/models"
  # Program used to run the model files. An empty value enables discovery,
  # starting with PATH so a user-installed version takes precedence.
  runner_programm: null
  # Non-language models have separate directories. A file's directory
  # determines its model type; relying on filenames previously caused
  # embedding models to appear in the chat model selector.
  einbettungsmodelle_verzeichnis: "./data/embedding_models"
  bildmodelle_verzeichnis: "./data/image_models"
  # Speech models and the small text model used to clean up dictation. No
  # models are included: the directory starts empty, and models are
  # available from the catalogue.
  sprachmodelle_verzeichnis: "./data/speech_models"
  # The embedding server is a separate model server and requires its own
  # port. Sharing a port with the chat model prevents the second server from
  # starting.
  einbettung_port: 8081
  # The speech server and its cleanup model likewise require separate ports.
  # Port 8082 is deliberately left available because manually started model
  # servers commonly use it.
  sprache_port: 8084
  sprachputz_port: 8085

database:
  # Only "sqlite" is supported right now. The repository pattern makes it
  # possible to add "postgres" later without touching the application logic.
  backend: "sqlite"
  path: "./data/exe-ai-terminal.db"

# Turn features on and off without changing code.
features:
  mcp: true                  # Tool calls through MCP servers
  document_upload: true      # Per-chat document upload (phase 4.1)
  # The shell tool: lets the model run commands in the folders you shared with
  # a chat. On by default, because the guard sits in the tool itself — sharing
  # a folder is the permission, without one it stays shut, and any command
  # reaching outside the share asks first.
  shell_tool: true

# Candidate endpoints specify WHERE a model server is located and HOW to communicate with it.
#
# The model name is read from the server using GET /v1/models, avoiding
# duplicate configuration. An optional `name:` provides a fallback if the
# server returns no name; otherwise, the id below is displayed.
#
# Maintain this list manually. A runtime health check determines which
# endpoints are reachable.
#
# reasoning_format — how the reasoning pass is read out of the response:
#   native  = separate field delta.reasoning (Gemma 4)
#   harmony = marker <|channel|>analysis (GPT-OSS)
#   think   = <think> tags (Magistral, Qwen, DeepSeek-R1)
#   none    = the model produces no reasoning pass
#
# parameter_dialect — what the server calls its sampling parameters:
#   llama_cpp | mlx | openai (the last one also covers anything unknown)
#
# Intentionally empty: a fresh installation has no configured servers.
# Uncomment an example below or add your own. One reachable endpoint is
# sufficient.
endpoints: []
  # Add an entry for each provider you want to use. The program
  # requires only one reachable endpoint.
  #
  # Every entry here is a provider reached over the network, and `group` says
  # as much: `cloud` for a paid service or for one on somebody else's
  # machine - nothing said means cloud. A server on this computer that you
  # started yourself (llama.cpp, LM Studio, Ollama) is a provider here as
  # well; a `group: "local"` on such an entry changes nothing, because the
  # LOCAL servers are the two this program starts itself - the main model
  # server and the agent server - and neither of them stands in this file.
  #
  # `group` determines how the model appears in the model selector and
  # whether chat memory may be sent to the endpoint without explicit
  # permission. This is not permitted for providers.
  #
  # Providers (requests leave this computer, key goes into .env):
  #
  #   - id: "openai"
  #     group: "cloud"
  #     base_url: "https://api.openai.com/v1"
  #     api_key_env: "OPENAI_API_KEY"
  #     parameter_dialect: "openai"
  #
  #   - id: "anthropic"
  #     group: "cloud"
  #     provider: "anthropic"
  #     base_url: "https://api.anthropic.com/v1"
  #     api_key_env: "ANTHROPIC_API_KEY"
  #     parameter_dialect: "anthropic"
  #
  # Without `modell:`, an entry represents a PROVIDER: its catalogue is
  # queried and all returned models can be selected. With `modell:`, the
  # entry refers only to that model, which is useful for catalogues
  # containing many models unrelated to chat.

mcp:
  # File containing tool server registrations. Its format matches other
  # programs, allowing existing server lists to be adopted without
  # conversion.
  servers_file: "./mcp_servers.json"
  # Rotating OAuth credentials for hosted servers. Stored separately from
  # the user-edited server list because this file is managed by the program,
  # and separately from .env, which holds fixed keys.
  auth_file: "./data/mcp_auth.json"


# How often endpoint reachability is checked, in seconds.
discovery:
  interval_seconds: 15
  timeout_seconds: 3

logging:
  level: "INFO"
  # Use "text" for readable journal output or "json" for machine processing.
  format: "text"
  # File name inside log_dir. Leave empty for console/journal only.
  file: "exe-ai-terminal.log"
  # Rotate logs above this size and retain the specified number of older files.
  max_bytes: 10485760
  file_count: 5
