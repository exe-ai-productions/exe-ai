# Exe AI — configuration
#
# This file is version-controlled and serves as the template. Secrets (API keys,
# passwords) do NOT belong here — put them in .env, see .env.example.
#
# It is also the list of everything the program knows. On every start the file
# you actually use is compared against this one, and any key missing from
# yours is written in with its comment — so a setting that arrives with an
# update is visible instead of hidden. Your own values are never touched, and
# a key added that way gets the program's built-in default, not the value
# below: what stands here is how a FRESH installation starts out.
#
# All paths are relative to the project directory unless given as absolute.
#
# Comments here are English because everyone who sets this up reads them.
# The source code stays German; that is the project's own language.
#
# When adding a key: its explanation goes ABOVE it, or on the same line. A
# comment line standing alone AFTER a value is read as introducing the next
# key and would travel with that one instead.

app:
  # Address the service listens on.
  # Local only: the service binds to 127.0.0.1; put your own reverse proxy
  # in front if you need remote access.
  host: "127.0.0.1"
  port: 8090
  # Default language of the interface: "en" or "de". English is the primary
  # language, German is kept fully equivalent. A request that names a
  # language overrides this: the interface's own X-Ui-Language header first,
  # then Accept-Language (app/api/abhaengigkeiten.py).
  language: "en"
  # The interface's diagnostic harness (the geometry watch): records
  # scroll anomalies, shows a report window and writes marker lines into
  # the access log. Meant for test services only.
  diagnose: false
  # The name a system notification carries when a schedule fires. Empty is
  # the program's own name. A test service running beside the shipped
  # install writes its own here — otherwise both announce themselves as the
  # same program and nobody can tell which of the two spoke.
  meldetitel: ""
  # Timezone for agent schedules (6.7). Times like schedule: "08:00" in an
  # agent file are read in this zone. Without it, the server zone applies —
  # and this server runs on UTC, which is not what a schedule usually means.
  timezone: "Europe/Berlin"
  # Directory for the database, uploaded documents and generated images.
  data_dir: "./data"
  log_dir: "./logs"
  # Where the pictures the generator draws are written. A named storage
  # location (app/speicherorte.py). Empty means "under data_dir" (so it
  # follows a moved data folder); set an absolute path to keep your pictures
  # on another drive.
  bilder_verzeichnis: ""
  # Where the scripts a cron entry may start are kept. A named storage
  # location like the pictures above, and empty means the same thing: under
  # data_dir. It is also the boundary — a schedule can only start a file that
  # lies inside this folder, links leading out of it included.
  skripte_verzeichnis: ""
  # Where the files agents deliver to the dock are kept. A named storage
  # location like the two above, and empty means the same thing: under
  # data_dir. The shelf's own record lives inside this folder, so the folder
  # IS the shelf — move it and the whole shelf goes with it.
  agentendock_verzeichnis: ""
  # Where the system prompt lives. Exactly one file for the whole program — not
  # one per model and no copy in the database. It is read fresh on EVERY
  # request, so an edit takes effect immediately, including in chats that
  # already exist. Edit it in the program under Chat -> System prompt, or by
  # hand. It ships empty.
  system_prompt_file: "./prompts/system.md"
  # The persistent memory: a second prompt file beside the first, written by
  # the model and by hand, read fresh on every request as well. Ships empty.
  memory_file: "./prompts/memory.md"
  # One Markdown file per agent — front matter plus prompt. Like the skills
  # below, agents live in two places: the shipped ones sit next to the
  # program and are replaced by every update; yours sit next to your prompts
  # and are never touched. Same name in both: yours wins.
  agenten_verzeichnis: "./prompts/agenten"
  agenten_mitgeliefert: "./agenten"
  # The permission rules a tool call is judged by (Tor 3). Personal, like
  # mcp_servers.json — what ships is berechtigungen.example.json, and this is
  # your own copy of it, created the first time the program runs.
  berechtigungen_datei: "./berechtigungen.json"
  # Skills live in two places. The shipped ones sit next to the program and
  # are replaced by every update; yours sit next to your prompts and are never
  # touched. Same name in both: yours wins.
  skills_mitgeliefert: "./skills"
  skills_verzeichnis: "./prompts/skills"
  # Where the model files live. This folder is the boundary — only what lies
  # inside it can be started.
  modelle_verzeichnis: "./data/models"
  # The program that runs those files. Empty means "look for it", in the PATH
  # first: whoever installed one of their own meant it to be used.
  runner_programm: null
  # Models that are not language models get folders of their own, and the
  # FOLDER is what decides which kind a file is — telling them apart by name
  # put an embedding model into the chat picker more than once.
  einbettungsmodelle_verzeichnis: "./data/embedding_models"
  bildmodelle_verzeichnis: "./data/image_models"
  # Speech models, and beside them the small text model that may tidy up a
  # dictation. Nothing ships in here: the folder starts empty and the
  # catalogue stands next to it.
  sprachmodelle_verzeichnis: "./data/speech_models"
  # The embedding server is a small model server of its own, so it needs a
  # port of its own — sharing one with the chat model makes the second start
  # fail.
  einbettung_port: 8081
  # The speech server and its tidy-up model, one port each for the same
  # reason. 8082 stays free on purpose: a model server started by hand lands
  # there often enough to collide with a default.
  sprache_port: 8084
  sprachputz_port: 8085

database:
  # Only "sqlite" is supported right now. The repository pattern makes it
  # possible to add "postgres" later without touching the application logic.
  backend: "sqlite"
  path: "./data/exe-ai-terminal.db"

# Turn features on and off without changing code.
features:
  mcp: true                  # Tool calls through MCP servers
  document_upload: true      # Per-chat document upload (phase 4.1)
  # The shell tool: lets the model run commands in the folders you shared with
  # a chat. On by default, because the guard sits in the tool itself — sharing
  # a folder is the permission, without one it stays shut, and any command
  # reaching outside the share asks first.
  shell_tool: true

# Candidate endpoints — WHERE a model server is and HOW to talk to it.
#
# What the model is CALLED is deliberately not in here. The name is read from
# the server itself (GET /v1/models) so that nobody has to maintain it in two
# places. An optional `name:` exists as a fallback for servers that report
# nothing; without it the id below is shown.
#
# The list is maintained by hand; which entries are actually reachable is
# checked at runtime by the health check.
#
# reasoning_format — how the reasoning pass is read out of the response:
#   native  = separate field delta.reasoning (Gemma 4)
#   harmony = marker <|channel|>analysis (GPT-OSS)
#   think   = <think> tags (Magistral, Qwen, DeepSeek-R1)
#   none    = the model produces no reasoning pass
#
# parameter_dialect — what the server calls its sampling parameters:
#   llama_cpp | mlx | openai (the last one also covers anything unknown)
#
# Empty on purpose: a fresh install knows no server yet. Uncomment one of
# the examples below, or add your own. One reachable entry is enough.
endpoints: []
  # Add one entry per provider you want to use. One reachable endpoint
  # is enough - the program works with a single one.
  #
  # Every entry here is a provider reached over the network, and `group` says
  # as much: `cloud` for a paid service or for one on somebody else's
  # machine - nothing said means cloud. A server on this computer that you
  # started yourself (llama.cpp, LM Studio, Ollama) is a provider here as
  # well; a `group: "local"` on such an entry changes nothing, because the
  # LOCAL servers are the two this program starts itself - the main model
  # server and the agent server - and neither of them stands in this file.
  #
  # What `group` decides: how the model picker groups the model, and whether
  # a chat's memory may travel to this endpoint unasked (it may not, for a
  # provider).
  #
  # Providers (requests leave this computer, key goes into .env):
  #
  #   - id: "openai"
  #     group: "cloud"
  #     base_url: "https://api.openai.com/v1"
  #     api_key_env: "OPENAI_API_KEY"
  #     parameter_dialect: "openai"
  #
  #   - id: "anthropic"
  #     group: "cloud"
  #     provider: "anthropic"
  #     base_url: "https://api.anthropic.com/v1"
  #     api_key_env: "ANTHROPIC_API_KEY"
  #     parameter_dialect: "anthropic"
  #
  # An entry without `modell:` is a PROVIDER: its catalogue is asked for and
  # every model in it can be picked. With `modell:` the entry stands for
  # exactly that one model — useful where the catalogue holds hundreds of
  # entries that have nothing to do with chatting.

mcp:
  # Where the tool servers are registered. A separate file rather than a
  # section here, because the format matches what other programs use — an
  # existing server list can be adopted without rewriting it.
  servers_file: "./mcp_servers.json"
  # The rotating OAuth credentials of the hosted servers. Separate from the
  # server list (you edit that one, the program edits this one) and separate
  # from .env, which holds fixed keys.
  auth_file: "./data/mcp_auth.json"


# How often endpoint reachability is checked, in seconds.
discovery:
  interval_seconds: 15
  timeout_seconds: 3

logging:
  level: "INFO"
  # "text" reads well in the journal, "json" can be processed by machine.
  format: "text"
  # File name inside log_dir. Leave empty for console/journal only.
  file: "exe-ai-terminal.log"
  # Rotate above this size, keep this many old files.
  max_bytes: 10485760
  file_count: 5
