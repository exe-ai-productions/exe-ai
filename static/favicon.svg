<!--
  Exe AI: the mark for the browser tab.

  The tile of the program icon, filling the whole area so that nothing of
  the sixteen pixels of a tab is given away, and without the bright glass
  rim, which reads as a white frame at that size. The strokes are drawn
  heavier than in the large icon: a faithful line would close up.
-->
