<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Exe AI</title>
<style>
  /* The moment between double click and service — the wordmark on the
     house background, nothing that could be mistaken for content. Ground
     and ink are the dark ones unless the script below sets others. */
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--ground, #141413); color: var(--ink, #ecebe6);
    font: 15px/1.6 -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  main { text-align: center; }
  /* The mark at half strength, as the start page draws it above its
     greeting: the splash and the page that follows read as one picture. */
  svg { display: block; margin: 0 auto 14px; opacity: 0.5; }
  p { margin: 0; opacity: 0.55; font-size: 13px; }
  /* No service, so no catalogue to ask for the language: both sentences,
     one under the other. */
  [data-zustand="fehlgeschlagen"] p::after {
    content: "The service did not respond. Check the log files.\A Der Dienst hat nicht geantwortet. Prüfe die Protokolldateien.";
    white-space: pre-line;
    display: block; margin-top: 6px; color: #e5484d; opacity: 1;
  }
</style>
<script>
  /* The shell opens this page on the frame colour of the look the interface
     showed last and names it in the address. The ground takes it, and the
     ink follows its brightness — the two inks and the threshold the
     interface uses on its own frame — so a light ground does not swallow
     the wordmark. Without a colour, or with anything that is not one, the
     page stays as it is. */
  (() => {
    const ground = new URLSearchParams(location.search).get('ground') || ''
    if (!/^#[0-9a-f]{6}$/i.test(ground)) return
    const [r, g, b] = [1, 3, 5].map((i) => parseInt(ground.slice(i, i + 2), 16) / 255)
    const light = 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.45
    const root = document.documentElement.style
    root.setProperty('--ground', ground)
    root.setProperty('--ink', light ? '#1a1a18' : '#ecebe6')
    root.setProperty('color-scheme', light ? 'light' : 'dark')
  })()
</script>
</head>
<body>
<main>
  <svg width="72" height="58" viewBox="0 0 80 64" fill="none" stroke="currentColor"
       stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="72" height="56" rx="15" />
    <path d="M20 22 L34 32 L20 42" stroke-width="5" />
    <path d="M42 42 H58" stroke-width="5" />
  </svg>
  <p>Starting …</p>
</main>
</body>
</html>
